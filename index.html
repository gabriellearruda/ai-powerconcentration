<title>A IA concentrando o poder na mão de poucos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Longform editorial treatment: full-bleed animated hero, narrow serif reading column, sticky masthead + section nav with scrollspy, reading-progress bar. Ink-on-paper with an oxblood editorial accent. */
  :root {
    --bg: #f1efe8;
    --surface: #ffffff;
    --surface-2: #e8e4db;
    --ink: #191712;
    --muted: #6a655b;
    --line: #ddd8ce;
    --accent: #a8301e;
    --accent-2: #2b5872;
    --ok: #3a7d53;
    --watch: #b57d22;
    --risk: #a02a1c;
    --shadow: 0 1px 2px rgba(26,25,21,.05), 0 10px 30px rgba(26,25,21,.06);
    --read: 680px;
    --wide: 1080px;
    font-synthesis-weight: none;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #13120f;
      --surface: #1b1a16;
      --surface-2: #211f1a;
      --ink: #ecebe5;
      --muted: #a39d92;
      --line: #2c2a24;
      --accent: #e46a56;
      --accent-2: #8fbae6;
      --ok: #5cbe87;
      --watch: #e0ad4e;
      --risk: #e46a56;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 34px rgba(0,0,0,.4);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #13120f;
    --surface: #1b1a16;
    --surface-2: #211f1a;
    --ink: #ecebe5;
    --muted: #a39d92;
    --line: #2c2a24;
    --accent: #e46a56;
    --accent-2: #8fbae6;
    --ok: #5cbe87;
    --watch: #e0ad4e;
    --risk: #e46a56;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 34px rgba(0,0,0,.4);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Newsreader", Georgia, "Times New Roman", serif;
    font-size: 19px;
    line-height: 1.68;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px);
    background: var(--surface);
    z-index: 60;
  }
  h1, h2, h3 { line-height: 1.1; margin: 0; text-wrap: balance; }
  p { margin: 0; }
  .ui { font-family: "Inter", system-ui, -apple-system, sans-serif; }

  .gutter { padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px)); }

  /* Masthead */
  header.mast {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 50;
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: saturate(1.3) blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .mast-row {
    max-width: var(--wide); margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding-block: 12px;
  }
  .wordmark { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink); text-align: left; min-width: 0; }
  .wordmark .mk { width: 22px; height: 22px; flex: none; }
  .wordmark b { font-family: "Inter", sans-serif; font-weight: 800; font-size: 14px; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .langs { display: flex; gap: 2px; background: var(--surface-2); border-radius: 999px; padding: 3px; flex: none; }
  .langs button { font: 700 11.5px/1 "Inter", sans-serif; letter-spacing: .04em; color: var(--muted); background: transparent; border: 0; border-radius: 999px; padding: 7px 11px; cursor: pointer; }
  .langs button[aria-pressed="true"] { background: var(--accent); color: #fff; }

  nav.toc {
    position: sticky;
    top: calc(env(safe-area-inset-top, 0px) + 47px);
    z-index: 49;
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: saturate(1.3) blur(10px);
    border-bottom: 1px solid var(--line);
    overflow: hidden;
  }
  .toc-inner { max-width: var(--wide); margin: 0 auto; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding-block: 2px; }
  .toc-inner::-webkit-scrollbar { display: none; }
  .toc-inner a { font: 600 12.5px/1 "Inter", sans-serif; color: var(--muted); text-decoration: none; white-space: nowrap; padding: 12px 14px; border-bottom: 2px solid transparent; }
  .toc-inner a.active { color: var(--accent); border-bottom-color: var(--accent); }
  .progress { position: absolute; left: 0; bottom: -1px; height: 2px; width: 0; background: var(--accent); z-index: 51; transition: width .08s linear; }

  /* Hero (committed dark band, own world) */
  .hero { position: relative; isolation: isolate; min-height: clamp(440px, 72vh, 660px); display: flex; align-items: flex-end; background: #0d0c0a; overflow: hidden; }
  .hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -2; display: block; }
  .hero::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(13,12,10,.15) 0%, rgba(13,12,10,.45) 55%, rgba(13,12,10,.9) 100%); }
  .hero-inner { max-width: var(--wide); margin: 0 auto; width: 100%; padding-block: 48px; }
  .hero-box { max-width: 760px; }
  .hero .kicker { font: 800 12px/1.4 "Inter", sans-serif; letter-spacing: .18em; text-transform: uppercase; color: #ec7b6b; margin-bottom: 20px; }
  .hero h1 { color: #f6f3ee; font-size: clamp(36px, 6.4vw, 66px); font-weight: 600; letter-spacing: -.02em; }
  .hero .dek { color: #d9d4cb; font-size: clamp(18px, 2.4vw, 23px); line-height: 1.45; margin-top: 22px; max-width: 46ch; font-weight: 400; }
  .byline { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 26px; font: 600 13px/1.4 "Inter", sans-serif; color: #b4aea3; }
  .byline span { display: inline-flex; align-items: center; gap: 7px; }
  .byline .dotsep { width: 4px; height: 4px; border-radius: 50%; background: #6a665e; align-self: center; }

  /* Article */
  article { display: block; }
  .band { border-bottom: 1px solid var(--line); }
  .col { max-width: var(--read); margin: 0 auto; padding-block: 52px; }
  .col.wide { max-width: var(--wide); }
  section[id] { scroll-margin-top: 110px; }

  .eyebrow { font: 800 12px/1.4 "Inter", sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin-bottom: 16px; }
  h2.title { font-size: clamp(27px, 4.2vw, 38px); font-weight: 600; letter-spacing: -.02em; }
  .prose { margin-top: 20px; display: flex; flex-direction: column; gap: 18px; }
  .prose p { font-size: 19px; }
  .prose p.first::first-letter { font-size: 3.1em; line-height: .82; float: left; margin: 7px 11px 0 0; color: var(--accent); font-weight: 600; }

  .pullquote { margin: 30px 0 6px; padding-left: 22px; border-left: 3px solid var(--accent); }
  .pullquote p { font-size: clamp(20px, 2.8vw, 25px); font-style: italic; line-height: 1.4; color: var(--ink); }
  .pullquote cite { display: block; margin-top: 12px; font: 600 13px/1.4 "Inter", sans-serif; font-style: normal; color: var(--muted); }

  /* Takeaway cards */
  .take { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 10px; }
  .tk { background: var(--surface); border: 1px solid var(--line); border-radius: 15px; padding: 22px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; }
  .tk .icwrap { width: 42px; height: 42px; border-radius: 11px; background: color-mix(in srgb, var(--accent) 13%, transparent); display: grid; place-items: center; }
  .tk .ic { width: 21px; height: 21px; color: var(--accent); }
  .tk h3 { font: 700 16px/1.3 "Inter", sans-serif; }
  .tk p { font: 400 14.5px/1.55 "Inter", sans-serif; color: var(--muted); }

  /* Mechanisms as interactive tabs */
  .mech { margin-top: 8px; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--surface); box-shadow: var(--shadow); }
  .mech-panel { padding: 28px 30px 30px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .mech-panel h3 { font-family: "Newsreader", serif; font-size: 24px; font-weight: 600; }
  .mech-panel p { font-size: 17px; color: var(--muted); line-height: 1.6; }
  .mech-panel .ex { font: 500 14px/1.5 "Inter", sans-serif; color: var(--ink); background: var(--surface-2); border-radius: 10px; padding: 13px 15px; }
  .mech-panel .ex b { color: var(--accent); }

  /* Mechanisms: reinforcing-loop diagram */
  .mechviz { margin: 30px auto 0; max-width: 480px; }
  .mechviz svg { width: 100%; height: auto; display: block; overflow: visible; }
  .mechviz .mv-arrow { fill: none; stroke: var(--line); stroke-width: 2; }
  .mv-node circle { fill: var(--surface); stroke: var(--line); stroke-width: 2; transition: stroke .2s ease, fill .2s ease; }
  .mv-node .mv-ic { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; color: var(--muted); transition: color .2s ease; }
  .mv-node .mv-ic svg { width: 22px; height: 22px; }
  .mv-node.active circle { stroke: var(--accent); fill: color-mix(in srgb, var(--accent) 11%, var(--surface)); }
  .mv-node.active .mv-ic { color: var(--accent); }
  .mv-node { cursor: pointer; }
  .mv-labels { display: flex; justify-content: space-between; gap: 8px; margin-top: 14px; }
  .mv-labels button { flex: 1; min-width: 0; font: 700 12px/1.3 "Inter", sans-serif; color: var(--muted); background: none; border: 0; border-radius: 9px; padding: 7px 4px; cursor: pointer; transition: color .2s ease, background .2s ease; }
  .mv-labels button.active { color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, transparent); }

  /* Combo: convergence diagram showing the 3 mechanisms compounding into a takeover */
  .combo { margin-top: 44px; padding-top: 36px; border-top: 1px solid var(--line); }
  .combo-head { font-family: "Newsreader", serif; font-size: 22px; font-weight: 600; }
  .combo-lead { font: 400 15px/1.6 "Inter", sans-serif; color: var(--muted); margin-top: 8px; max-width: 56ch; }
  .combo-viz { margin: 26px auto 0; max-width: 520px; }
  .combo-viz svg { width: 100%; height: auto; display: block; overflow: visible; }
  .cv-in circle { fill: var(--surface); stroke: var(--line); stroke-width: 2; }
  .cv-in .cv-ic { color: var(--muted); }
  .cv-out circle { fill: color-mix(in srgb, var(--accent) 12%, var(--surface)); stroke: var(--accent); stroke-width: 2.5; }
  .cv-out .cv-ic { color: var(--accent); }
  .cv-ic { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; }
  .cv-ic svg { width: 20px; height: 20px; }
  .cv-out .cv-ic svg { width: 24px; height: 24px; }
  .cv-arrow { fill: none; stroke: color-mix(in srgb, var(--accent) 45%, var(--line)); stroke-width: 2; }
  .combo-steps { margin-top: 24px; display: flex; flex-direction: column; gap: 12px; }
  .combo-steps div { display: flex; gap: 12px; align-items: baseline; font: 400 15px/1.55 "Inter", sans-serif; color: var(--muted); }
  .combo-steps span { flex: none; width: 20px; height: 20px; border-radius: 50%; background: color-mix(in srgb, var(--accent-2) 16%, transparent); color: var(--accent-2); font: 800 11px/20px "Inter", sans-serif; text-align: center; }
  .combo-result { margin-top: 18px; background: color-mix(in srgb, var(--accent) 8%, var(--surface)); border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--line)); border-radius: 13px; padding: 18px 20px; font: 500 15.5px/1.6 "Inter", sans-serif; color: var(--ink); }
  .combo-result b { color: var(--accent); }

  /* Coup factor cards */
  .factors { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 26px; }
  .fac { background: var(--surface); border: 1px solid var(--line); border-radius: 15px; padding: 22px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; }
  .fac .ic { width: 30px; height: 30px; color: var(--accent-2); }
  .fac .n { font: 800 11px/1 "Inter", sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
  .fac h3 { font-family: "Newsreader", serif; font-size: 20px; font-weight: 600; }
  .fac p { font: 400 14px/1.55 "Inter", sans-serif; color: var(--muted); }
  .note { margin-top: 18px; font: 400 15px/1.6 "Inter", sans-serif; color: var(--muted); background: var(--surface-2); border-left: 3px solid var(--accent); border-radius: 0 12px 12px 0; padding: 15px 18px; }

  /* Scenario vertical timeline with concentration meter */
  .timeline { margin-top: 30px; margin-left: 8px; }
  .tl-item { position: relative; padding: 0 0 34px 36px; border-left: 2px solid var(--line); }
  .tl-item:last-child { border-left-color: transparent; padding-bottom: 4px; }
  .tl-node { position: absolute; left: -10px; top: 0; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 5px var(--bg), 0 0 0 6px var(--line); }
  .tl-year { font: 800 14px/1 "Inter", sans-serif; letter-spacing: .08em; color: var(--accent); font-variant-numeric: tabular-nums; }
  .tl-head { font-family: "Newsreader", serif; font-size: 23px; font-weight: 600; margin-top: 9px; letter-spacing: -.01em; }
  .tl-body { font: 400 16px/1.62 "Inter", sans-serif; color: var(--muted); margin-top: 9px; max-width: 54ch; }
  .tl-meter { margin-top: 16px; max-width: 360px; }
  .tl-meter .mhead { display: flex; justify-content: space-between; align-items: baseline; font: 700 10.5px/1 "Inter", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 7px; }
  .tl-meter .mhead b { color: var(--accent); font-weight: 800; }
  .tl-meter .track { height: 9px; border-radius: 999px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--line); }
  .tl-meter .fill { height: 100%; border-radius: 999px; width: 0; background: linear-gradient(90deg, var(--accent-2), var(--accent)); transition: width 1s cubic-bezier(.4,0,.2,1); }
  .disclaim { margin-top: 18px; font-size: 14px; color: var(--muted); font-style: italic; }

  /* Trends figure */
  .figtag { font: 800 11.5px/1.4 "Inter", sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .ind { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 24px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 9px; box-shadow: var(--shadow); }
  .tile .lbl { font: 500 13px/1.4 "Inter", sans-serif; color: var(--muted); min-height: 2.8em; }
  .tile .val { font: 800 29px/1 "Inter", sans-serif; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .tile .cap { font: 400 12.5px/1.45 "Inter", sans-serif; color: var(--muted); }
  .pill { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font: 700 10.5px/1 "Inter", sans-serif; letter-spacing: .05em; text-transform: uppercase; padding: 5px 9px; border-radius: 999px; }
  .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pill.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 16%, transparent); }
  .pill.watch { color: var(--watch); background: color-mix(in srgb, var(--watch) 18%, transparent); }
  .pill.risk { color: var(--risk); background: color-mix(in srgb, var(--risk) 16%, transparent); }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 20px; font: 500 12.5px/1.4 "Inter", sans-serif; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .legend i { width: 9px; height: 9px; border-radius: 50%; }

  /* Comparison */
  .cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 24px; }
  .cmp .cc { background: var(--surface); border: 1px solid var(--line); border-radius: 15px; padding: 22px; box-shadow: var(--shadow); }
  .cmp .cc .tag { font: 800 11px/1 "Inter", sans-serif; letter-spacing: .1em; text-transform: uppercase; color: #fff; background: var(--accent); display: inline-block; padding: 5px 9px; border-radius: 6px; margin-bottom: 12px; }
  .cmp .cc:nth-child(2) .tag { background: var(--accent-2); }
  .cmp .cc h3 { font-family: "Newsreader", serif; font-size: 20px; font-weight: 600; }
  .cmp .cc p { font: 400 15px/1.55 "Inter", sans-serif; color: var(--muted); margin-top: 11px; }
  .verdict { margin-top: 18px; background: var(--surface-2); border-radius: 13px; padding: 20px 22px; font-size: 18px; line-height: 1.55; }
  .verdict b { color: var(--accent); font-weight: 600; }

  /* Actions: editorial numbered list, not cards */
  .acts { margin-top: 8px; }
  .act { display: grid; grid-template-columns: 56px 1fr; gap: 18px; align-items: start; padding: 24px 0; border-top: 1px solid var(--line); }
  .act:last-child { border-bottom: 1px solid var(--line); }
  .act .mk { font-family: "Newsreader", serif; font-size: 30px; font-weight: 500; color: var(--accent); line-height: 1; font-variant-numeric: tabular-nums; }
  .act h3 { font: 700 16.5px/1.35 "Inter", sans-serif; }
  .act p { font: 400 14.5px/1.55 "Inter", sans-serif; color: var(--muted); margin-top: 6px; max-width: 58ch; }

  .govnote { margin-top: 28px; display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px 24px; box-shadow: var(--shadow); }
  .govnote .gk { width: 34px; height: 34px; flex: none; color: var(--accent-2); }
  .govnote .gtag { font: 800 11px/1.3 "Inter", sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--accent-2); margin-bottom: 6px; }
  .govnote p { font: 400 15.5px/1.6 "Inter", sans-serif; color: var(--ink); }
  .citeline { margin-top: 16px; font: 500 13px/1.5 "Inter", sans-serif; color: var(--muted); }
  .citeline b { color: var(--ink); font-weight: 600; }
  .ex a, .citeline a, .govnote a { color: var(--accent); text-decoration-color: color-mix(in srgb, var(--accent) 45%, transparent); text-underline-offset: 2px; }
  .ex a:hover, .citeline a:hover, .govnote a:hover { text-decoration-color: var(--accent); }

  /* Glossary */
  .gloss { margin-top: 24px; border-top: 1px solid var(--line); }
  .gl { display: grid; grid-template-columns: 220px 1fr; gap: 18px; padding: 17px 2px; border-bottom: 1px solid var(--line); }
  .gl dt { font: 700 15.5px/1.4 "Inter", sans-serif; color: var(--ink); }
  .gl dd { margin: 0; font: 400 15px/1.55 "Inter", sans-serif; color: var(--muted); }

  /* Sources + footer */
  .src { margin-top: 22px; display: grid; gap: 10px; }
  .src a { display: flex; gap: 14px; align-items: baseline; text-decoration: none; padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; color: var(--ink); }
  .src a .ar { color: var(--accent); font: 700 15px/1 "Inter", sans-serif; }
  .src a .st { display: block; color: var(--muted); font: 400 12.5px/1.4 "Inter", sans-serif; margin-top: 3px; }
  .src a .tt { font: 600 15px/1.35 "Inter", sans-serif; }
  footer { max-width: var(--read); margin: 0 auto; padding-block: 34px 52px; color: var(--muted); font: 400 13px/1.6 "Inter", sans-serif; }

  /* Hover polish */
  .tk, .fac, .tile, .act, .src a { transition: transform .18s ease, box-shadow .2s ease, border-color .2s ease; }
  @media (hover: hover) {
    .tk:hover, .fac:hover, .tile:hover, .act:hover, .src a:hover { transform: translateY(-3px); box-shadow: 0 2px 4px rgba(26,25,21,.06), 0 16px 38px rgba(26,25,21,.12); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
    .tl-item:hover .tl-node { box-shadow: 0 0 0 5px var(--bg), 0 0 0 7px color-mix(in srgb, var(--accent) 45%, transparent); }
  }

  @media (max-width: 760px) {
    .take, .factors, .cmp { grid-template-columns: 1fr; }
    .ind { grid-template-columns: repeat(2, 1fr); }
    .gl { grid-template-columns: 1fr; gap: 4px; }
  }
  @media (max-width: 460px) {
    body { font-size: 18px; }
    .ind { grid-template-columns: 1fr; }
    .tl-head { font-size: 21px; }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  html { scroll-behavior: smooth; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap">

<header class="mast">
  <div class="mast-row gutter">
    <button class="wordmark" id="wordmark" aria-label="Topo">
      <svg class="mk" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="4" fill="var(--accent)"></circle>
        <circle cx="4" cy="5" r="1.6" fill="var(--muted)"></circle>
        <circle cx="20" cy="5" r="1.6" fill="var(--muted)"></circle>

const htmlLang = { pt: "pt-BR", en: "en", es: "es" };
const statusWord = {
  pt: { ok: "Distribuído", watch: "Em tensão", risk: "Atenção" },
  en: { ok: "Distributed", watch: "Tension", risk: "Watch" },
  es: { ok: "Distribuido", watch: "Tensión", risk: "Atención" }
};

function el(t, c, txt) { const n = document.createElement(t); if (c) n.className = c; if (txt != null) n.textContent = txt; return n; }
function set(id, txt) { const n = document.getElementById(id); if (n) n.textContent = txt; }
function setHTML(id, h) { const n = document.getElementById(id); if (n) n.innerHTML = h; }

let activeMech = 0, lang = "pt";

function render(l) {
  lang = l;
  const d = C[l];
  document.documentElement.lang = htmlLang[l];
  set("brand", d.brand);

  set("hero-kicker", d.hero.kicker);
  set("hero-title", d.hero.title);
  set("hero-dek", d.hero.dek);

  set("ess-eyebrow", d.ess.eyebrow);
  set("ess-title", d.ess.title);
  const ec = document.getElementById("ess-cards"); ec.innerHTML = "";
  d.ess.cards.forEach(c => {
    const card = el("div", "tk");
    const icon = el("div", "icwrap"); icon.innerHTML = ICON[c.ic]; card.appendChild(icon);
    card.appendChild(el("h3", null, c.title));
    card.appendChild(el("p", null, c.body));
    ec.appendChild(card);
  });

  set("define-eyebrow", d.define.eyebrow);
  set("define-title", d.define.title);
  set("define-p1", d.define.p1);
  set("define-p2", d.define.p2);
  setHTML("define-source", d.define.source);

  set("mech-eyebrow", d.mech.eyebrow);
  set("mech-title", d.mech.title);
  set("mech-lead", d.mech.lead);
  const mvLabels = document.getElementById("mv-labels"); mvLabels.innerHTML = "";
  d.mech.items.forEach((it, i) => {
    const btn = el("button", null, it.title);
    btn.type = "button";
    btn.setAttribute("role", "tab");
    btn.setAttribute("aria-selected", i === activeMech ? "true" : "false");
    btn.addEventListener("click", () => { activeMech = i; paintMech(); });
    mvLabels.appendChild(btn);
  });
  paintMech();

  set("combo-title", d.mech.combo.title);
  set("combo-lead", d.mech.combo.lead);
  const cs = document.getElementById("combo-steps"); cs.innerHTML = "";
  d.mech.combo.steps.forEach((s, i) => {
    const row = el("div");
    row.appendChild(el("span", null, String(i + 1)));
    row.appendChild(el("p", null, s));
    cs.appendChild(row);
  });
  setHTML("combo-result", d.mech.combo.result);

  set("scen-eyebrow", d.scen.eyebrow);
  set("scen-title", d.scen.title);
  const tl = document.getElementById("timeline"); tl.innerHTML = "";
  const fills = [];
  d.scen.steps.forEach((s, i) => {
    const item = el("div", "tl-item");
    item.appendChild(el("span", "tl-node"));
    item.appendChild(el("div", "tl-year", s.yr));
    item.appendChild(el("div", "tl-head", s.hd));
    item.appendChild(el("div", "tl-body", s.body));
    const lv = d.scen.meter.levels[i];
    const meter = el("div", "tl-meter");
    const mh = el("div", "mhead");
    mh.appendChild(el("span", null, d.scen.meter.label));
    mh.appendChild(el("b", null, lv.t));
    meter.appendChild(mh);
    const track = el("div", "track");
    const fill = el("div", "fill");
    track.appendChild(fill); meter.appendChild(track);
    item.appendChild(meter);
    tl.appendChild(item);
    fills.push([fill, lv.w]);
  });
  requestAnimationFrame(() => fills.forEach(([f, w]) => { f.style.width = w + "%"; }));
  set("scen-disclaim", d.scen.disclaim);
  setHTML("scen-source", d.scen.source);

  set("trend-fig", d.trend.fig);
  set("trend-title", d.trend.title);
  set("trend-lead", d.trend.lead);
  const tt = document.getElementById("trend-tiles"); tt.innerHTML = "";
  d.trend.tiles.forEach(t => {
    const tile = el("div", "tile");
    tile.appendChild(el("div", "lbl", t.lbl));
    tile.appendChild(el("div", "val", t.val));
    tile.appendChild(el("span", "pill " + t.st, statusWord[l][t.st]));
    tile.appendChild(el("div", "cap", t.cap));
    tt.appendChild(tile);
  });
  const lg = document.getElementById("trend-legend"); lg.innerHTML = "";
  d.trend.legend.forEach(x => { const s = el("span"); const i = el("i"); i.style.background = x.c; s.appendChild(i); s.appendChild(document.createTextNode(x.t)); lg.appendChild(s); });
  set("trend-note", d.trend.note);

  set("act-eyebrow", d.act.eyebrow);
  set("act-title", d.act.title);
  set("act-lead", d.act.lead);
  const ai = document.getElementById("act-items"); ai.innerHTML = "";

  set("act-note-tag", d.act.noteTag);

  set("src-eyebrow", d.src.eyebrow);
  set("src-title", d.src.title);

  set("footer", d.footer);
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === l ? "true" : "false"));
}

function paintMech() {
  const it = C[lang].mech.items[activeMech];
  const panel = document.getElementById("mech-panel");
  panel.innerHTML = "";
  panel.appendChild(el("h3", null, it.title));
  panel.appendChild(el("p", null, it.body));
  const ex = el("div", "ex"); ex.innerHTML = it.ex; panel.appendChild(ex);
  document.querySelectorAll(".mv-node").forEach(n => n.classList.toggle("active", Number(n.dataset.i) === activeMech));
  document.querySelectorAll("#mv-labels button").forEach((b, i) => { b.classList.toggle("active", i === activeMech); b.setAttribute("aria-selected", i === activeMech ? "true" : "false"); });
}

document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => {
  render(b.dataset.lang);

render(startLang);

/* Hero canvas: drifting nodes converging toward a few hubs */
(function heroViz() {
  const canvas = document.getElementById("heroCanvas");
  const ctx = canvas.getContext("2d");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W = 0, Hh = 0, dpr = Math.min(window.devicePixelRatio || 1, 2), raf = 0;
  const hubs = [], nodes = [];
  function seed() {
    hubs.length = 0; nodes.length = 0;
    const hc = 3;
    for (let i = 0; i < hc; i++) hubs.push({ x: (0.28 + 0.44 * i / (hc - 1)) * W, y: Hh * (0.34 + 0.12 * Math.sin(i * 2)) });
    const n = Math.max(40, Math.min(130, Math.floor(W * Hh / 14000)));
    for (let i = 0; i < n; i++) {
      nodes.push({ x: Math.random() * W, y: Math.random() * Hh, vx: (Math.random() - .5) * .25, vy: (Math.random() - .5) * .25, hub: hubs[Math.floor(Math.random() * hubs.length)] });
    }
  }
  function resize() {
    const r = canvas.getBoundingClientRect();
    W = r.width; Hh = r.height;
    canvas.width = Math.max(1, W * dpr); canvas.height = Math.max(1, Hh * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    seed();
  }
  function frame() {
    ctx.clearRect(0, 0, W, Hh);
    for (const nd of nodes) {
      if (!reduce) {
        nd.x += nd.vx; nd.y += nd.vy;
        if (nd.x < 0 || nd.x > W) nd.vx *= -1;
        if (nd.y < 0 || nd.y > Hh) nd.vy *= -1;
      }
      const dx = nd.hub.x - nd.x, dy = nd.hub.y - nd.y;
      const dist = Math.hypot(dx, dy);
      const a = Math.max(0, 1 - dist / (W * 0.4));
      if (a > 0.02) {
        ctx.strokeStyle = "rgba(226,103,84," + (a * 0.5).toFixed(3) + ")";
        ctx.lineWidth = 0.6;
        ctx.beginPath(); ctx.moveTo(nd.x, nd.y); ctx.lineTo(nd.hub.x, nd.hub.y); ctx.stroke();
      }
      ctx.fillStyle = "rgba(230,224,214,0.5)";
      ctx.beginPath(); ctx.arc(nd.x, nd.y, 1.3, 0, 6.283); ctx.fill();
    }
    for (const h of hubs) {
      const g = ctx.createRadialGradient(h.x, h.y, 0, h.x, h.y, 34);
      g.addColorStop(0, "rgba(226,103,84,0.9)"); g.addColorStop(1, "rgba(226,103,84,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(h.x, h.y, 34, 0, 6.283); ctx.fill();
      ctx.fillStyle = "#f0a596"; ctx.beginPath(); ctx.arc(h.x, h.y, 4, 0, 6.283); ctx.fill();
    }
    if (!reduce) raf = requestAnimationFrame(frame);
  }
  const ro = new ResizeObserver(() => { cancelAnimationFrame(raf); resize(); frame(); });
  ro.observe(canvas);
  resize(); frame();
})();
</script>
